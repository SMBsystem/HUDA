<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP &amp; IELTS — База знаний и пробники</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .card-clean {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      transition: all 0.18s ease;
    }
    .card-clean:hover {
      border-color: #6366f1;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -8px rgba(15, 23, 42, 0.08);
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- МИНИМАЛИСТИЧНАЯ ШАПКА -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <button id="homeLogoBtn" type="button" class="text-base font-bold text-slate-900 hover:text-indigo-600 transition">
        ESP Knowledge Base
      </button>
      <button id="topBackBtn" type="button" class="hidden text-sm font-medium text-slate-600 hover:text-slate-900 flex items-center gap-1.5">
        <span>← Назад к темам</span>
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8">

    <!-- ==================== ЭКРАН 1: КАРТОЧКИ ТЕМ ==================== -->
    <section id="screenTopics" class="space-y-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Темы базы знаний</h1>
        <p class="text-sm text-slate-500 mt-1">Выбери карточку темы, чтобы открыть разделы Reading, Listening, Writing и Speaking.</p>
      </div>

      <div id="topicsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </section>

    <!-- ==================== ЭКРАН 2: СТРАНИЦА ТЕМЫ (4 РАЗДЕЛА + СПИСОК ВАРИАНТОВ) ==================== -->
    <section id="screenTopicDetail" class="hidden space-y-6">
      <div class="space-y-1">
        <button id="backToTopicsBtn" type="button" class="text-xs font-medium text-indigo-600 hover:text-indigo-800 mb-1 inline-block">
          ← Все карточки тем
        </button>
        <h2 id="topicHeading" class="text-2xl font-bold text-slate-900"></h2>
        <p id="topicDesc" class="text-sm text-slate-500"></p>
      </div>

      <!-- 4 простых таба разделов -->
      <div class="flex border-b border-slate-200 gap-6 overflow-x-auto" id="skillTabsBar">
        <button type="button" data-skill="reading" class="skill-tab pb-3 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 whitespace-nowrap">
          Reading (5)
        </button>
        <button type="button" data-skill="listening" class="skill-tab pb-3 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap">
          Listening (5)
        </button>
        <button type="button" data-skill="writing" class="skill-tab pb-3 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap">
          Writing (5)
        </button>
        <button type="button" data-skill="speaking" class="skill-tab pb-3 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap">
          Speaking (5)
        </button>
      </div>

      <!-- Список из 5 вариантов пробника -->
      <div id="variantsListContainer" class="space-y-3"></div>
    </section>

    <!-- ==================== ЭКРАН 3: ОТКРЫТЫЙ ВАРИАНТ ПРОБНИКА ==================== -->
    <section id="screenVariantView" class="hidden space-y-6">
      <div>
        <button id="backToVariantsBtn" type="button" class="text-xs font-medium text-indigo-600 hover:text-indigo-800 mb-2 inline-block">
          ← Назад к списку вариантов
        </button>
        <div id="variantSkillLabel" class="text-xs font-semibold uppercase tracking-wider text-slate-400"></div>
        <h2 id="variantTitleHeading" class="text-xl sm:text-2xl font-bold text-slate-900 mt-0.5"></h2>
      </div>

      <div id="variantContentBody" class="space-y-6"></div>
    </section>

  </main>

          num: i + 1,
          title: `Вариант ${i + 1}: ${t} — ${angle}`,
          knowledge: `Ключевое знание: ${idea} В этом варианте отрабатываются термины: ${terms[i]}, ${terms[(i + 1) % 5]}.`,
          passage: [
            `<strong>Paragraph A — Core Concept (${angle})</strong><br/>Understanding <em>${t}</em> requires looking at its fundamental mechanisms rather than surface-level stereotypes. In specialized English literature, experts focus on <strong>${terms[i]}</strong> and how it interacts with <strong>${terms[(i + 1) % 5]}</strong>.`,
            `<strong>Paragraph B — Practical Mechanism</strong><br/>${idea} When practitioners systematically train and observe <strong>${terms[(i + 2) % 5]}</strong>, they achieve far more reliable results than through random trial and error.`
          ],
          questions: [
            {
              id: `${topic.id}_r_${i}_1`,
              q: `1. [TRUE / FALSE / NOT GIVEN] Experts in "${t}" focus on underlying mechanisms such as ${terms[i]}.`,
              opts: ['TRUE', 'FALSE', 'NOT GIVEN'],
              ans: 'TRUE',
              exp: 'В абзаце A прямо сказано, что специалисты опираются на фундаментальные механизмы.'
            },
            {
              id: `${topic.id}_r_${i}_2`,
              q: `2. What produces more reliable results than random trial and error?`,
              opts: [
                `Systematically training and observing ${terms[(i + 2) % 5]}`,
                'Ignoring all theory',
                'Copying popular myths'
              ],
              ans: `Systematically training and observing ${terms[(i + 2) % 5]}`,
              exp: 'Системная практика и понимание механизма дают предсказуемый результат.'
            }
          ]
        })),

        listening: FOCUS_ANGLES.map((angle, i) => ({
          num: i + 1,
          title: `Вариант ${i + 1}: Аудио-разбор — ${t} (${angle})`,
          knowledge: `Слушаем и улавливаем на слух профильные связки: ${terms[i]} и ${terms[(i + 1) % 5]}.`,
          script: `Lecturer: In today's session on ${t}, we focus on ${angle}. Many beginners assume that results come from luck—Wait, actually, research confirms that mastering ${terms[i]} and ${terms[(i + 1) % 5]} is what truly drives progress.`,
          questions: [
            {
              id: `${topic.id}_l_${i}_1`,
              q: '1. What does the lecturer say actually drives progress?',
              opts: [
                `Mastering ${terms[i]} and ${terms[(i + 1) % 5]}`,
                'Pure luck and coincidence',
                'Skipping foundational practice'
              ],
              ans: `Mastering ${terms[i]} and ${terms[(i + 1) % 5]}`,
              exp: 'После слова-маркера "Wait, actually..." лектор называет ключевой фактор прогресса.'
            }
          ]
        })),

        writing: FOCUS_ANGLES.map((angle, i) => ({
          num: i + 1,
          title: `Вариант ${i + 1}: Эссе и аналитика — ${t} (${angle})`,
          knowledge: `Используй в своем ответе ключевые термины темы: ${terms[i]}, ${terms[(i + 1) % 5]}.`,
          prompt: `Writing Prompt (${t}): Explain why understanding "${terms[i]}" and "${terms[(i + 1) % 5]}" is valuable for modern education and personal development.`,
          model: `<strong>Пример ответа Band 8.5:</strong><br/>Building a solid foundation in <em>${t}</em> offers both intellectual and practical benefits. Specifically, understanding <strong>${terms[i]}</strong> and <strong>${terms[(i + 1) % 5]}</strong> allows individuals to analyze real-world processes with precision rather than relying on guesswork.`
        })),

        speaking: FOCUS_ANGLES.map((angle, i) => ({
          num: i + 1,
          title: `Вариант ${i + 1}: Устная практика — ${t} (${angle})`,
          knowledge: `Задача: за 1–2 минуты просто и структурно объяснить концепт «${terms[i]}» на английском.`,
          part1: `<strong>Part 1:</strong> Why are you interested in ${t}?<br/><strong>Answer:</strong> It gives me real-world knowledge about ${terms[i]} while expanding my English vocabulary.`,
          part2: `<strong>Part 2 Cue Card:</strong> Explain a key idea from "${t}" (${angle}).<br/><strong>Опорные слова:</strong> ${terms[i]} • ${terms[(i + 1) % 5]} • ${terms[(i + 2) % 5]}`,
          part2Model: `<strong>Пример монолога:</strong> I’d like to explain a key principle from ${t}. The core mechanism revolves around ${terms[i]} and ${terms[(i + 1) % 5]}. Understanding how this works in practice helps me apply it in daily life and discuss complex topics fluently in English.`,
          part3: `<strong>Part 3:</strong> How does "${t}" connect to other areas of knowledge?<br/><strong>Answer:</strong> Principles like ${terms[(i + 2) % 5]} connect directly to psychology, health, and technology.`
        }))
      };
    });

    // =========================================================================
    // СОСТОЯНИЕ И НАВИГАЦИЯ (3 ПРОСТЫХ ЭКРАНА)
    // =========================================================================
    let currentTopicId = 'ielts-prep';
    let currentSkill = 'reading';
    let currentVariantIdx = 0;
    const selectedAnswers = {};
    const checkedState = {};

    function stopSpeech() {
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
    }

    function showScreen(screenName) {
      stopSpeech();
      document.getElementById('screenTopics').classList.add('hidden');
      document.getElementById('screenTopicDetail').classList.add('hidden');
      document.getElementById('screenVariantView').classList.add('hidden');

      const topBack = document.getElementById('topBackBtn');
      if (screenName === 'topics') {
        document.getElementById('screenTopics').classList.remove('hidden');
        topBack.classList.add('hidden');
      } else if (screenName === 'topicDetail') {
        document.getElementById('screenTopicDetail').classList.remove('hidden');
        topBack.classList.remove('hidden');
      } else if (screenName === 'variantView') {
        document.getElementById('screenVariantView').classList.remove('hidden');
        topBack.classList.remove('hidden');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 1. Отрисовка чистых карточек на главной
    function renderTopics() {
      const grid = document.getElementById('topicsGrid');
      grid.innerHTML = TOPICS.map((t, index) => `
        <button type="button" data-topic-id="${t.id}" class="card-clean rounded-xl p-5 text-left flex flex-col justify-between gap-3 ${index === 0 ? 'ring-2 ring-indigo-500/80' : ''}">
          <div class="space-y-2">
            <div class="text-2xl">${t.icon}</div>
            <div class="text-base font-bold text-slate-900">${t.title}</div>
            <p class="text-xs text-slate-500 leading-relaxed">${t.shortDesc}</p>
          </div>
          <div class="text-xs font-semibold text-indigo-600 pt-1">
            Открыть →
          </div>
        </button>
      `).join('');

      grid.querySelectorAll('[data-topic-id]').forEach((btn) => {
        btn.addEventListener('click', () => {
          currentTopicId = btn.getAttribute('data-topic-id');
          currentSkill = 'reading';
          renderTopicDetail();
          showScreen('topicDetail');
        });
      });
    }

    // 2. Отрисовка страницы темы (4 раздела + 5 вариантов)
    function renderTopicDetail() {
      const topic = TOPICS.find((t) => t.id === currentTopicId) || TOPICS[0];
      document.getElementById('topicHeading').textContent = `${topic.icon} ${topic.title}`;
      document.getElementById('topicDesc').textContent = topic.shortDesc;

      document.querySelectorAll('.skill-tab').forEach((tab) => {
        const sk = tab.getAttribute('data-skill');
        const count = topic.sections[sk].length;
        const label = sk.charAt(0).toUpperCase() + sk.slice(1);
        tab.textContent = `${label} (${count})`;
        if (sk === currentSkill) {
          tab.className = 'skill-tab pb-3 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 whitespace-nowrap';
        } else {
          tab.className = 'skill-tab pb-3 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap';
        }
      });

      const list = topic.sections[currentSkill] || [];
      const container = document.getElementById('variantsListContainer');
      container.innerHTML = list.map((v, idx) => `
        <button type="button" data-var-idx="${idx}" class="card-clean w-full rounded-xl p-4 text-left flex items-center justify-between gap-4">
          <div class="space-y-1">
            <div class="text-sm font-semibold text-slate-900">${v.title}</div>
            <div class="text-xs text-slate-500 line-clamp-1">${v.knowledge}</div>
          </div>
          <span class="text-xs font-semibold text-indigo-600 shrink-0">Начать →</span>
        </button>
      `).join('');

      container.querySelectorAll('[data-var-idx]').forEach((btn) => {
        btn.addEventListener('click', () => {
          currentVariantIdx = parseInt(btn.getAttribute('data-var-idx'), 10);
          renderVariantView();
          showScreen('variantView');
        });
      });
    }

    // 3. Отрисовка конкретного открытого пробника (чистый лист)
    function renderVariantView() {
      const topic = TOPICS.find((t) => t.id === currentTopicId) || TOPICS[0];
      const variant = topic.sections[currentSkill][currentVariantIdx];
      const varKey = `${topic.id}_${currentSkill}_${variant.num}`;

      document.getElementById('variantSkillLabel').textContent = `${topic.title} • ${currentSkill.toUpperCase()}`;
      document.getElementById('variantTitleHeading').textContent = variant.title;

      const body = document.getElementById('variantContentBody');

      // Блок реального знания (1 чистая плашка сверху)
      const knowledgeHtml = `
        <div class="p-4 rounded-xl bg-indigo-50 border border-indigo-100 text-sm text-indigo-950 leading-relaxed">
          💡 ${variant.knowledge}
        </div>
      `;

      if (currentSkill === 'reading') {
        const isChecked = !!checkedState[varKey];
        body.innerHTML = `
          ${knowledgeHtml}
          <div class="bg-white rounded-xl border border-slate-200 p-5 sm:p-6 space-y-4 text-sm text-slate-800 leading-7">
            ${variant.passage.map((p) => `<p>${p}</p>`).join('')}
          </div>
          <div class="space-y-4">
            <h3 class="text-base font-bold text-slate-900">Вопросы по тексту</h3>
            ${variant.questions.map((q) => {
              const userPick = selectedAnswers[q.id];
              return `
                <div class="bg-white rounded-xl border border-slate-200 p-4 space-y-3">
                  <div class="text-sm font-semibold text-slate-900">${q.q}</div>
                  <div class="space-y-2">
                    ${q.opts.map((opt) => {
                      const active = userPick === opt;
                      let cls = 'border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700';
                      if (active && !isChecked) cls = 'border-indigo-600 bg-indigo-50 text-indigo-900 font-medium';
                      if (isChecked) {
                        if (opt === q.ans) cls = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold';
                        else if (active && opt !== q.ans) cls = 'border-rose-400 bg-rose-50 text-rose-900';
                      }
                      return `<button type="button" data-qid="${q.id}" data-opt="${opt.replace(/"/g, '&quot;')}" class="q-opt-btn w-full text-left px-3.5 py-2 rounded-lg border text-xs sm:text-sm transition ${cls}">${opt}</button>`;
                    }).join('')}
                  </div>
                  ${isChecked ? `<div class="text-xs text-slate-600 bg-slate-50 p-3 rounded-lg border border-slate-200"><strong>Пояснение:</strong> ${q.exp}</div>` : ''}
                </div>
              `;
            }).join('')}
            <button id="checkTestBtn" type="button" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition">
              Проверить ответы
            </button>
          </div>
        `;

        body.querySelectorAll('.q-opt-btn').forEach((b) => {
          b.addEventListener('click', () => {
            selectedAnswers[b.getAttribute('data-qid')] = b.getAttribute('data-opt');
            renderVariantView();
          });
        });

        document.getElementById('checkTestBtn').addEventListener('click', () => {
          checkedState[varKey] = true;
          renderVariantView();
        });

      } else if (currentSkill === 'listening') {
        const isChecked = !!checkedState[varKey];
        body.innerHTML = `
          ${knowledgeHtml}
          <div class="bg-white rounded-xl border border-slate-200 p-5 space-y-4">
            <div class="flex flex-wrap items-center gap-3">
              <button id="playAudioBtn" type="button" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold">
                ▶ Прослушать аудио (English)
              </button>
              <button id="stopAudioBtn" type="button" class="px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm">
                Стоп
              </button>
              <button id="toggleScriptBtn" type="button" class="px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm">
                Показать / скрыть текст аудио
              </button>
            </div>
            <div id="scriptBox" class="hidden p-4 rounded-lg bg-slate-50 border border-slate-200 text-sm text-slate-700 whitespace-pre-line leading-relaxed">${variant.script}</div>
          </div>

          <div class="space-y-4">
            <h3 class="text-base font-bold text-slate-900">Вопросы по аудио</h3>
            ${variant.questions.map((q) => {
              const userPick = selectedAnswers[q.id];
              return `
                <div class="bg-white rounded-xl border border-slate-200 p-4 space-y-3">
                  <div class="text-sm font-semibold text-slate-900">${q.q}</div>
                  <div class="space-y-2">
                    ${q.opts.map((opt) => {
                      const active = userPick === opt;
                      let cls = 'border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700';
                      if (active && !isChecked) cls = 'border-indigo-600 bg-indigo-50 text-indigo-900 font-medium';
                      if (isChecked) {
                        if (opt === q.ans) cls = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold';
                        else if (active && opt !== q.ans) cls = 'border-rose-400 bg-rose-50 text-rose-900';
                      }
                      return `<button type="button" data-qid="${q.id}" data-opt="${opt.replace(/"/g, '&quot;')}" class="q-opt-btn w-full text-left px-3.5 py-2 rounded-lg border text-xs sm:text-sm transition ${cls}">${opt}</button>`;
                    }).join('')}
                  </div>
                  ${isChecked ? `<div class="text-xs text-slate-600 bg-slate-50 p-3 rounded-lg border border-slate-200"><strong>Пояснение:</strong> ${q.exp}</div>` : ''}
                </div>
              `;
            }).join('')}
            <button id="checkTestBtn" type="button" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition">
              Проверить ответы
            </button>
          </div>
        `;

        document.getElementById('playAudioBtn').addEventListener('click', () => {
          if ('speechSynthesis' in window) {
            try {
              window.speechSynthesis.cancel();
              const u = new SpeechSynthesisUtterance(variant.script);
              u.lang = 'en-US';
              window.speechSynthesis.speak(u);
            } catch (e) {}
          }
        });
        document.getElementById('stopAudioBtn').addEventListener('click', stopSpeech);
        document.getElementById('toggleScriptBtn').addEventListener('click', () => {
          document.getElementById('scriptBox').classList.toggle('hidden');
        });

        body.querySelectorAll('.q-opt-btn').forEach((b) => {
          b.addEventListener('click', () => {
            selectedAnswers[b.getAttribute('data-qid')] = b.getAttribute('data-opt');
            renderVariantView();
          });
        });

        document.getElementById('checkTestBtn').addEventListener('click', () => {
          checkedState[varKey] = true;
          renderVariantView();
        });

      } else if (currentSkill === 'writing') {
        body.innerHTML = `
          ${knowledgeHtml}
          <div class="bg-white rounded-xl border border-slate-200 p-5 space-y-3">
            <div class="text-xs font-bold uppercase text-slate-400">Задание (Prompt)</div>
            <p class="text-sm font-medium text-slate-900 leading-relaxed">${variant.prompt}</p>
          </div>

          <div class="space-y-2">
            <textarea rows="8" placeholder="Напиши свой ответ здесь..." class="w-full rounded-xl border border-slate-300 bg-white p-4 text-sm text-slate-900 focus:outline-none focus:border-indigo-600"></textarea>
          </div>

          <div>
            <button id="showModelWritingBtn" type="button" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-semibold">
              Показать / скрыть пример ответа Band 8.5
            </button>
            <div id="modelWritingBox" class="hidden mt-4 bg-white rounded-xl border border-slate-200 p-5 text-sm text-slate-800 leading-relaxed">
              ${variant.model}
            </div>
          </div>
        `;

        document.getElementById('showModelWritingBtn').addEventListener('click', () => {
          document.getElementById('modelWritingBox').classList.toggle('hidden');
        });

      } else if (currentSkill === 'speaking') {
        body.innerHTML = `
          ${knowledgeHtml}
          <div class="bg-white rounded-xl border border-slate-200 p-5 space-y-4 text-sm text-slate-800 leading-relaxed">
            <div>${variant.part1}</div>
            <div class="border-t border-slate-100 pt-4">${variant.part2}</div>
            <div class="border-t border-slate-100 pt-4">${variant.part3}</div>
          </div>

          <div>
            <button id="showModelSpeakingBtn" type="button" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-semibold">
              Показать / скрыть пример монолога Part 2
            </button>
            <div id="modelSpeakingBox" class="hidden mt-4 bg-white rounded-xl border border-slate-200 p-5 text-sm text-slate-800 leading-relaxed">
              ${variant.part2Model}
            </div>
          </div>
        `;

        document.getElementById('showModelSpeakingBtn').addEventListener('click', () => {
          document.getElementById('modelSpeakingBox').classList.toggle('hidden');
        });
      }
    }

    // Инициализация
    window.addEventListener('DOMContentLoaded', () => {
      renderTopics();

      document.getElementById('homeLogoBtn').addEventListener('click', () => showScreen('topics'));
      document.getElementById('topBackBtn').addEventListener('click', () => showScreen('topics'));
      document.getElementById('backToTopicsBtn').addEventListener('click', () => showScreen('topics'));
      document.getElementById('backToVariantsBtn').addEventListener('click', () => showScreen('topicDetail'));

      document.querySelectorAll('.skill-tab').forEach((tab) => {
        tab.addEventListener('click', () => {
          currentSkill = tab.getAttribute('data-skill');
          renderTopicDetail();
        });
      });
    });
  </script>
</body>
</html>
